name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Unit tests (iOS Simulator)
        run: |
          set -o pipefail
          # Pick an iPhone on the newest installed iOS runtime.
          UDID=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | (.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)) as $ver
              | .value[] | select(.name | startswith("iPhone")) | {ver: $ver, udid}]
            | sort_by(.ver) | last | .udid // empty')
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator available"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Simulator: $UDID"
          xcodebuild test \
            -project I4A.xcodeproj \
            -scheme I4A \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Release build (device, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project I4A.xcodeproj \
            -scheme I4A \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
