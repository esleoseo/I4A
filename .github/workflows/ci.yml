name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Unit tests (iOS Simulator)
        run: |
          set -o pipefail
          # Pick an iPhone simulator the active Xcode can actually run.
          UDID=$(xcodebuild -project I4A.xcodeproj -scheme I4A -showdestinations 2>/dev/null \
            | awk '/Ineligible destinations/{exit} /platform:iOS Simulator/ && /name:iPhone/ && !/error:/ { if (match($0, /id:[^,]+/)) { print substr($0, RSTART+3, RLENGTH-3); exit } }' || true)
          if [ -z "$UDID" ]; then
            echo "::error::No eligible iPhone simulator for the active Xcode"
            xcodebuild -project I4A.xcodeproj -scheme I4A -showdestinations || true
            exit 1
          fi
          echo "Simulator: $UDID"
          xcodebuild test \
            -project I4A.xcodeproj \
            -scheme I4A \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Release build (device, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project I4A.xcodeproj \
            -scheme I4A \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
